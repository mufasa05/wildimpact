<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WildImpact - Luxury African Safari Eco-Tourism & Wildlife Conservation Tech Platform. Automated Carbon Offsetting, CAMPFIRE Community Levies & Real-Time ESG Reporting.">
  <meta name="theme-color" content="#08130E">

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="WildImpact - Luxury Safari & Conservation ESG Platform">
  <meta property="og:description" content="Empowering African safari operators, guests, and conservancies with real-time ESG metrics, carbon calculator, and community impact tracking.">
  <meta property="og:image" content="assets/images/wildimpact_logo.jpg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WildImpact">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="favicon.png"/>

  <title>WildImpact - Luxury Safari & Conservation ESG Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #08130E;
      color: #F9FAFB;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #08130E;
    }
    .loading-logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.25);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.8; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
